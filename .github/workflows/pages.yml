name: Validate and deploy MMD demos
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      compare_browser_matrices:
        description: Repeat full/representative browser phase measurements on this runner
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  # An unrelated label event skips validation and must not cancel a real run.
  group: pages-${{ github.event.action == 'labeled' && github.event.label.name != 'browser-performance' && github.run_id || github.ref }}
  cancel-in-progress: true
jobs:
  typecheck:
    if: github.event.action != 'labeled' || github.event.label.name == 'browser-performance'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: git diff --check
  prepare:
    if: github.event.action != 'labeled' || github.event.label.name == 'browser-performance'
    outputs:
      pages-artifact: ${{ steps.pages-name.outputs.name }}
    # Playwright 1.56.1 supports Ubuntu 24.04, but not Ubuntu 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: |
            .cache/gene-light
            .cache/uka
          key: mmd-sources-${{ hashFiles('tools/gene-light-manifest.json', 'tools/uka-manifest.json') }}
      - run: npm run build
      - name: List the complete unfiltered test set
        run: npm run test:browser -- --list
        env:
          BROWSER_LIST_PATH: .cache/browser-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: browser-manifest
          include-hidden-files: true
          path: .cache/browser-manifest.json
          if-no-files-found: error
          retention-days: 7
      # Include generated dev-server assets and verified source data for Node tests.
      # A tar preserves hidden paths and exact bytes without re-running conversion.
      - run: tar -czf validated-build.tar.gz dist public .cache/gene-light .cache/uka
      - uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: validated-build
          path: validated-build.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Identify this prepared Pages artifact
        id: pages-name
        run: echo "name=github-pages-attempt-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ steps.pages-name.outputs.name }}
          path: dist
  fast-checks:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: validated-build
      - run: tar -xzf validated-build.tar.gz
      - run: npx playwright install --with-deps chromium
      - name: Early browser integration smoke (full coverage also runs in shards)
        run: npm run test:browser -- tests/browser/bdef.spec.ts tests/browser/demo-loading.spec.ts tests/browser/source-transport.spec.ts tests/browser/public-assets.spec.ts
        env:
          PLAYWRIGHT_CHROMIUM_CHANNEL: chromium
      - run: npm test
      - run: npm run check:links
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          overwrite: true
          name: browser-smoke-evidence
          path: test-results/
          if-no-files-found: error
          retention-days: 7
  browser:
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      BROWSER_SHARD: ${{ matrix.shard }}
      PLAYWRIGHT_CHROMIUM_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: validated-build
      - run: tar -xzf validated-build.tar.gz
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          overwrite: true
          name: browser-evidence-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: error
          retention-days: 7
  build:
    # Keep the existing build check name as the final required validation gate.
    # Run after any prerequisite failure: a skipped required check can permit merge.
    if: always() && (github.event.action != 'labeled' || github.event.label.name == 'browser-performance')
    needs: [prepare, typecheck, fast-checks, browser]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: browser-manifest
          path: .cache/browser-shards
      - uses: actions/download-artifact@v4
        with:
          pattern: browser-evidence-*
          path: .cache/browser-shards
      - run: npx tsx tools/browser-aggregate.ts
      - name: Require every validation job to succeed
        if: always()
        env:
          VALIDATION_RESULTS: ${{ toJSON(needs) }}
        run: |
          node <<'NODE'
          const results = JSON.parse(process.env.VALIDATION_RESULTS);
          const failures = Object.entries(results).filter(([, job]) => job.result !== 'success');
          for (const [name, job] of failures) console.error(`${name}: ${job.result}`);
          if (failures.length) process.exit(1);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          overwrite: true
          name: browser-aggregate
          path: test-results/browser-aggregate.json
          if-no-files-found: error
          retention-days: 7
  browser-performance:
    if: inputs.compare_browser_matrices == true || contains(github.event.pull_request.labels.*.name, 'browser-performance')
    needs: prepare
    runs-on: ubuntu-24.04
    env:
      PLAYWRIGHT_CHROMIUM_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: validated-build
      - run: tar -xzf validated-build.tar.gz
      - run: npx playwright install --with-deps chromium
      # The measurement script needs its own unfiltered default, not a single shard.
      - run: npm run test:browser
      - run: bash tools/measure-browser-ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          overwrite: true
          name: browser-performance
          include-hidden-files: true
          path: |
            .cache/browser-performance/
            test-results/
          if-no-files-found: error
          retention-days: 7
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [prepare, typecheck, fast-checks, browser, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: ${{ needs.prepare.outputs.pages-artifact }}
